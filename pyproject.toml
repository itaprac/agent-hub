[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hub"
version = "0.1.0"
description = "Self-hosted control plane for AI coding-agent skills and instructions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12", "mypy>=1.15"]

[project.scripts]
agent-hub = "agenthub.cli:main"
agent-hub-web = "agenthub.webapp:main"

[tool.setuptools]
packages = ["agenthub"]
# hub.py and web.py stay importable as the compatibility entry points.
py-modules = ["hub", "usage", "web"]

[tool.setuptools.data-files]
"share/agent-hub/web" = ["web/index.html", "web/style.css"]
"share/agent-hub/web/js" = ["web/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
agenthub = ["agents.json"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["agenthub"]
