<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>agent-hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23211f1a'/%3E%3Cg fill='%23e0b15a'%3E%3Ccircle cx='8' cy='8' r='2'/%3E%3Ccircle cx='3.2' cy='3.2' r='1.4'/%3E%3Ccircle cx='12.8' cy='3.2' r='1.4'/%3E%3Ccircle cx='3.2' cy='12.8' r='1.4'/%3E%3Ccircle cx='12.8' cy='12.8' r='1.4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="progress" class="progress" aria-hidden="true" hidden></div>
<div id="app-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- ============================================================ rail -->
<aside class="rail">
  <div class="mark-row">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 16 16">
        <path d="M8 8 3.2 3.2M8 8l4.8-4.8M8 8l-4.8 4.8M8 8l4.8 4.8" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
        <circle cx="8" cy="8" r="2.2" fill="currentColor"/>
        <circle cx="3.2" cy="3.2" r="1.4" fill="currentColor"/>
        <circle cx="12.8" cy="3.2" r="1.4" fill="currentColor"/>
        <circle cx="3.2" cy="12.8" r="1.4" fill="currentColor"/>
        <circle cx="12.8" cy="12.8" r="1.4" fill="currentColor"/>
      </svg>
    </span>
    <span class="mark-txt">
      <span class="mark-name">agent-hub</span>
      <span class="mark-sub">skills across machines</span>
    </span>
  </div>

  <nav class="rail-nav" role="tablist" aria-label="Views" aria-orientation="vertical">
    <div class="sect" aria-hidden="true">Operate</div>
    <div class="sect-rule" aria-hidden="true"></div>
    <button class="tab" id="tab-status" role="tab" data-tab="status" aria-selected="true" aria-controls="view-status" tabindex="0" title="Status (1)" aria-keyshortcuts="1">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.6 8.4h3l1.6-4 2.2 7 1.6-3.6h4"/></svg>
      <span class="lbl">Status</span>
      <kbd>1</kbd>
    </button>
    <button class="tab" id="tab-usage" role="tab" data-tab="usage" aria-selected="false" aria-controls="view-usage" tabindex="-1" title="Usage (2)" aria-keyshortcuts="2">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12.4 5.2 8l2.4 2.8L12.4 4.4"/><path d="M10.4 4.4h2v2"/></svg>
      <span class="lbl">Usage</span>
      <kbd>2</kbd>
    </button>

    <div class="sect" aria-hidden="true">Repository</div>
    <div class="sect-rule" aria-hidden="true"></div>
    <button class="tab" id="tab-skills" role="tab" data-tab="skills" aria-selected="false" aria-controls="view-skills" tabindex="-1" title="Skills (3)" aria-keyshortcuts="3">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8 14 5v6L8 14.2 2 11V5z"/><path d="M2 5l6 3.2L14 5M8 8.2v6"/></svg>
      <span class="lbl">Skills</span>
      <span class="tab-dot" hidden title="Unsaved edits"></span>
      <kbd>3</kbd>
    </button>
    <button class="tab" id="tab-instructions" role="tab" data-tab="instructions" aria-selected="false" aria-controls="view-instructions" tabindex="-1" title="Instructions (4)" aria-keyshortcuts="4">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.4 2.2h6l3.2 3.2v8.4H3.4z"/><path d="M9.2 2.2v3.4h3.4M5.6 8.6h4.8M5.6 11h3.2"/></svg>
      <span class="lbl">Instructions</span>
      <span class="tab-dot" hidden title="Unsaved edits"></span>
      <kbd>4</kbd>
    </button>
    <button class="tab" id="tab-config" role="tab" data-tab="config" aria-selected="false" aria-controls="view-config" tabindex="-1" title="Config (5)" aria-keyshortcuts="5">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.1"/><path d="M8 1.6v1.8M8 12.6v1.8M14.4 8h-1.8M3.4 8H1.6M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3M12.5 12.5l-1.3-1.3M4.8 4.8 3.5 3.5"/></svg>
      <span class="lbl">Config</span>
      <span class="tab-dot" hidden title="Unsaved edits"></span>
      <kbd>5</kbd>
    </button>
  </nav>

  <div class="rail-foot">
    <div class="host" id="machine-chip">
      <span class="beacon" aria-hidden="true"></span>
      <span class="host-txt">
        <span class="host-name" id="machine-id">…</span>
        <span class="host-meta" id="machine-host">…</span>
      </span>
      <button class="host-settings" id="btn-rail-settings" type="button" title="Settings" aria-label="Settings">
        <svg class="host-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span class="host-settings-label">Settings</span>
      </button>
    </div>
  </div>
</aside>

<!-- ============================================================ shell -->
<div class="shell">

  <div class="topline">
    <span class="crumb">hub <b>/</b> <b id="crumb-view">status</b></span>
    <span class="repo-path" id="repo-path" title="repository root"></span>
    <span class="spacer"></span>
    <div class="theme-picker">
      <button class="btn btn-icon" id="btn-theme" title="Colour scheme: dark" aria-label="Colour scheme"
              aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu">
        <span id="theme-icon" aria-hidden="true"></span>
        <span id="theme-name">dark</span>
      </button>
      <div class="theme-menu" id="theme-menu" role="menu" aria-label="Colour scheme" hidden></div>
    </div>
    <button class="btn go" id="btn-refresh" title="Refresh state, status and machines (R)" aria-keyshortcuts="r">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.4 8a5.4 5.4 0 1 1-1.6-3.8"/><path d="M13.6 2v3h-3"/></svg>
      Refresh
    </button>
  </div>

  <div id="banner" class="banner" role="alert" aria-atomic="true" hidden></div>

  <main id="views">
    <section class="view" id="view-status" data-view="status" role="tabpanel" aria-labelledby="tab-status" tabindex="0">
      <div class="page">
        <h1 class="sr-only">Status</h1>
        <div class="statusbar" id="summary" role="status"></div>

        <section class="sec peers" id="peers">
          <div class="sec-head">
            <h2 class="sec-title">Machines</h2>
            <span class="pill pill-idle" id="peers-verdict" title="federation sync state">
              <span class="dot"></span><span id="peers-verdict-text">Unknown</span>
            </span>
            <span class="spacer"></span>
            <span class="sec-note" id="peers-meta" role="status" aria-live="polite" aria-atomic="true"></span>
            <label class="switch" title="pass --dry-run to the Apply and Sync buttons on the cards">
              <input type="checkbox" id="dry-run">
              <span class="sw" aria-hidden="true"></span>
              <span>dry-run</span>
            </label>
          </div>
          <div class="mgrid" id="peers-grid"></div>
        </section>

        <section class="sec">
          <div class="sec-head">
            <h2 class="sec-title">Managed state</h2>
            <span class="spacer"></span>
            <div class="status-toolbar" id="status-toolbar" hidden>
              <div class="segmented" id="status-filter" role="group" aria-label="Managed state filter">
                <button class="seg active" type="button" data-filter="all" aria-pressed="true">All</button>
                <button class="seg" type="button" data-filter="problems" aria-pressed="false">Problems</button>
              </div>
            </div>
          </div>
          <div id="status-groups" class="groups"></div>
        </section>
      </div>
    </section>

    <section class="view" id="view-usage" data-view="usage" role="tabpanel" aria-labelledby="tab-usage" tabindex="0" hidden>
      <div class="page usage-page" id="usage-root"></div>
    </section>
    <section class="view workspace" id="view-skills" data-view="skills" role="tabpanel" aria-labelledby="tab-skills" tabindex="0" hidden></section>
    <section class="view workspace" id="view-instructions" data-view="instructions" role="tabpanel" aria-labelledby="tab-instructions" tabindex="0" hidden></section>
    <section class="view workspace" id="view-config" data-view="config" role="tabpanel" aria-labelledby="tab-config" tabindex="0" hidden></section>
    <section class="view" id="view-settings" data-view="settings" role="tabpanel" aria-label="Settings" tabindex="0" hidden>
      <div class="page settings-page" id="settings-root"></div>
    </section>
  </main>

  <footer class="logbar" id="logbar">
    <button class="logbar-head" id="log-toggle" aria-expanded="false" aria-controls="log-body" title="Toggle the log drawer (L)" aria-keyshortcuts="l">
      <span class="caret" aria-hidden="true">▸</span>
      <span class="log-title">Log</span>
      <kbd>L</kbd>
      <span class="log-cmd" id="log-cmd">no command yet</span>
      <span class="log-exit" id="log-exit" hidden></span>
      <span class="spacer"></span>
      <span class="log-time" id="log-time"></span>
    </button>
    <pre class="log-body" id="log-body" hidden></pre>
  </footer>
</div>

<div class="toasts" id="toasts"></div>
<dialog class="modal" id="modal"></dialog>

<script type="module" src="/js/app.js"></script>
</body>
</html>
